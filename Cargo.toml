[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]
default-members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
authors = ["Chud Clone"]
repository = "https://github.com/BigFatDeuce/Chud-Clone"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
# The engine must stop cleanly (handles closed, volumes unlocked):
# keep stack unwinding rather than "abort".
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
