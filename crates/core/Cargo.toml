[package]
name = "chud-clone-core"
version.workspace = true
edition.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = "0.4.45"
crc32fast = "1.5.5"
fatfs = "0.3.6"
ntfs = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
flate2 = "1.1.11"
gptman = "3.1.1"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_Storage_IscsiDisc", "Win32_Storage_Nvme", "Win32_System_WindowsProgramming", "Win32_Globalization", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Power"] }
