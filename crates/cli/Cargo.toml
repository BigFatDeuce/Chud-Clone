[package]
name = "chud-clone-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chud Clone — disk cloning and diagnostics (command line)"

[[bin]]
name = "chud-clone-cli"
path = "src/main.rs"

[dependencies]
chud-clone-core = { path = "../core" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde_json = "1"

[dev-dependencies]
flate2 = "1.1.11"

[build-dependencies]
static_vcruntime = "3.0"
