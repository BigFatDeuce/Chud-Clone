[package]
name = "chud-clone-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chud Clone — disk cloning and diagnostics"

[[bin]]
name = "chud-clone"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chud-clone-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "custom-protocol": the interface is embedded in the executable (no development server).
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
# Checksum of downloaded updates.
sha2 = "0.10"

[target."cfg(windows)".dependencies]
# Update check (WinHTTP: system TLS and proxy settings) and installer launch.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
