[package]
name = "chud-clone-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chud Clone — disk cloning and diagnostics"

[[bin]]
name = "chud-clone"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chud-clone-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# « custom-protocol » : l'interface est embarquée dans l'exécutable (aucun serveur de développement).
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
