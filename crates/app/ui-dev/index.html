<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chud Clone — banc d'essai</title>
    <link rel="stylesheet" href="../ui/style.css" />
  </head>
  <body>
    <!-- UI bench: same interface as the application, simulated engine (mock.js). Never shipped. -->
    <canvas id="cosmos"></canvas>
    <div id="app">
      <header class="titlebar">
        <div class="brand"><img src="../ui/logo-tiny.svg" alt="" /><span>Chud Clone</span></div>
        <nav>
          <button data-view="clone" class="active" data-fr="Cloner" data-en="Clone">Cloner</button>
          <button data-view="disks" data-fr="Disques et santé" data-en="Disks &amp; health">Disques et santé</button>
          <button data-view="format" data-fr="Formater" data-en="Format">Formater</button>
          <button data-view="reports" data-fr="Rapports" data-en="Reports">Rapports</button>
          <button data-view="settings" data-fr="Réglages" data-en="Settings">Réglages</button>
        </nav>
        <div class="grow"></div>
        <button id="admin" class="admin"></button>
        <div class="win">
          <button id="win-min" aria-label="Réduire" data-afr="Réduire" data-aen="Minimize"><svg viewBox="0 0 11 11"><path d="M1 5.5h9" stroke="currentColor" stroke-width="1.1" /></svg></button>
          <button id="win-max" aria-label="Agrandir" data-afr="Agrandir" data-aen="Maximize"><svg viewBox="0 0 11 11"><rect x="1.5" y="1.5" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.1" /></svg></button>
          <button id="win-close" aria-label="Fermer" data-afr="Fermer" data-aen="Close"><svg viewBox="0 0 11 11"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="currentColor" stroke-width="1.1" /></svg></button>
        </div>
      </header>
      <main id="view"></main>
    </div>
    <div id="modal-root"></div>
    <div id="toasts"></div>
    <script src="mock-data.js"></script>
    <script src="mock-data-en.js"></script>
    <script src="mock.js"></script>
    <script src="../ui/cosmos.js"></script>
    <script src="../ui/app.js"></script>
    <script src="demo.js"></script>
  </body>
</html>
