# Builds the WinPE rescue ISO (bootable from Ventoy, or written to a USB key with Rufus)
# and attaches it to the release.
#
# The ISO embeds the chud-clone-cli.exe of the release's portable archive, so it carries
# exactly the binary that was published (built and checked by scripts\package.ps1).
# Building WinPE needs the Windows ADK and its WinPE add-on, and administrator rights:
# GitHub's Windows runners provide both.

name: WinPE ISO

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.3.0)
        required: true
      ref:
        description: "Branch or tag for the menu and scripts (default: the release tag). The CLI always comes from the release."
        required: false

permissions:
  contents: write

jobs:
  iso:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Pinned to a commit: a moved tag cannot change what runs with write access.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || inputs.tag }}

      - name: Install the Windows ADK (deployment tools) and the WinPE add-on
        shell: pwsh
        run: |
          choco install windows-adk-deploy windows-adk-winpe -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'ADK installation failed' }

      - name: Get chud-clone-cli.exe from the release
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "ChudClone-$v-portable.zip" --pattern "SHA256SUMS-$v.txt" --dir rel
          if ($LASTEXITCODE -ne 0) { throw 'download failed' }
          # The ISO must carry exactly the published binary: the archive is checked
          # against the release's checksum file before it is used.
          $line = Get-Content "rel\SHA256SUMS-$v.txt" | Where-Object { $_ -match "^([0-9a-fA-F]{64})\s+\*?ChudClone-$([regex]::Escape($v))-portable\.zip$" } | Select-Object -First 1
          if (-not $line) { throw 'portable archive missing from the checksum file' }
          $expected = ($line -split '\s+')[0].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 "rel\ChudClone-$v-portable.zip").Hash.ToLower()
          if ($actual -ne $expected) { throw "portable archive checksum mismatch: $actual, expected $expected" }
          Expand-Archive "rel\ChudClone-$v-portable.zip" rel
          "CLI=$PWD\rel\ChudClone-$v-portable\chud-clone-cli.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the ISO
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\make-winpe.ps1 -Cli $env:CLI -Output "$PWD\dist\ChudClone-$env:VERSION-winpe.iso"
          if ($LASTEXITCODE -ne 0) { throw 'make-winpe failed' }

      - name: Attach the ISO and its checksum to the release
        shell: pwsh
        run: |
          $iso = "dist\ChudClone-$env:VERSION-winpe.iso"
          $h = (Get-FileHash -Algorithm SHA256 $iso).Hash.ToLower()
          [IO.File]::WriteAllText("$iso.sha256", "$h  ChudClone-$env:VERSION-winpe.iso`n", [Text.Encoding]::ASCII)
          gh release upload $env:TAG $iso "$iso.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'upload failed' }
